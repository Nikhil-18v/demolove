services:
  db:
    image: postgres:16
    container_name: food-delivery-db
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
