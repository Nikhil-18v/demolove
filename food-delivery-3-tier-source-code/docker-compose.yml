services:
  frontend:
    image: frontend:latest
    container_name: food-delivery-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    image: backend:latest
    container_name: food-delivery-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: food_delivery
      DB_USER: fooduser
      DB_PASSWORD: foodpass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: food-delivery-db
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: fooduser
      POSTGRES_PASSWORD: foodpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fooduser -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
